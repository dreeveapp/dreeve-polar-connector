name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Run CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact release, not a floating major: setup-uv publishes moving `vN` tags only up
        # to v7, so `@v8` and `@v9` do not resolve at all and the job dies before it checks anything out.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Validate the lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check --output-format=github

      - name: Run Ruff format dry-run
        run: uv run ruff format --check

      - name: Run mypy
        run: uv run mypy

      - name: Run test suite
        run: uv run pytest --cov --cov-report=term-missing

  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned image rather than a curl-to-shell installer, and a container rather than a third-party
      # action, so nothing unreviewed runs with the workflow's token.
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
